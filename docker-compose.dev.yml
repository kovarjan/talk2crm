services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_GPU_DEPS: ${INSTALL_GPU_DEPS:-false}
        PIP_TIMEOUT: ${PIP_TIMEOUT:-120}
        PIP_RETRIES: ${PIP_RETRIES:-10}
    container_name: talk2crm-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8011 --reload --no-access-log
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DEBUG: ${DEBUG:-true}
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
    ports:
      - "8011:8011"
    volumes:
      - ./:/app
      - ./cache:/app/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: talk2crm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: talk2crm-adminer
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: talk2crm-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./.qdrant_storage:/qdrant/storage
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: talk2crm-dozzle
    volumes:
      # This is the magic. It gives Dozzle permission to read other containers' logs.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8090:8080"
    environment:
      # Optional: Filter to only show containers from this project
      - DOZZLE_FILTER=name=talk2crm
    restart: unless-stopped

volumes:
  postgres_data:
