services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talk2api2-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8011 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sugar_voice_bridge
      QDRANT_URL: http://qdrant:6333
      ENVIRONMENT: dev
      DEBUG: "true"
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8011:8011"
    volumes:
      - ./:/app
      - ./cache:/app/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: talk2api2-postgres
    environment:
      POSTGRES_DB: sugar_voice_bridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sugar_voice_bridge"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: talk2api2-adminer
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: talk2api2-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./.qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
