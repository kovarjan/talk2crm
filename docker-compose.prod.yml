services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_GPU_DEPS: ${INSTALL_GPU_DEPS:-true}
        PIP_TIMEOUT: ${PIP_TIMEOUT:-120}
        PIP_RETRIES: ${PIP_RETRIES:-10}
    image: talk2crm-api:latest
    container_name: talk2crm-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8011 --workers ${UVICORN_WORKERS:-2} --proxy-headers --forwarded-allow-ips='*' --no-access-log
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    gpus: ${DOCKER_GPUS:-all}
    ports:
      - "8011:8011"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8011/ping/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: talk2crm-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: talk2crm-qdrant
    ports:
      - "6333:6333"
    env_file:
      - .env
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: talk2crm-adminer
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  hf_cache:
